name: CI

on:
  push:
    branches:
      - main
      # Guarantees the first run (issue #5) even if the PR base branch has no workflow yet.
      - chore/5-windows-ci
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (build, fmt, clippy, test)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable

      - name: Show environment
        shell: bash
        run: |
          echo "commit: $(git rev-parse HEAD)"
          git log -1 --format='%H %P %s'
          echo "workspace: $GITHUB_WORKSPACE"
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: npm ci
        run: npm ci

      # Must run before cargo: tauri::generate_context!() reads frontendDist.
      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
