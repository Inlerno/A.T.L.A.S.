[package]
name = "atlas"
version = "0.1.0"
description = "ATLAS — local AI assistant for Windows"
authors = ["Inlerno"]
edition = "2024"
# Minimum Rust version required by the Tauri 2.12 dependency graph (tauri-utils, tauri-runtime-wry, tray-icon).
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panic = "abort" from the template is intentionally removed:
# a panic in an optional module task must not terminate the whole app (see CLAUDE.md).
