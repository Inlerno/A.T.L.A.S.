[package]
name = "atlas"
version = "0.1.0"
description = "ATLAS — local AI assistant for Windows"
authors = ["Inlerno"]
edition = "2024"
# Minimum Rust version required by the Tauri 2.12 dependency graph (tauri-utils, tauri-runtime-wry, tray-icon).
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core foundation (issue #6). Features are listed explicitly; do not rely on feature unification.
thiserror = { version = "2.0.21", features = ["std"] }
# default-features = false: the `attributes` feature (#[instrument], tracing-attributes) is not used.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "registry", "fmt", "ansi", "env-filter", "tracing-log"] }
tracing-appender = "0.2.5"
# Event bus (issue #8) and module manager (issue #9): sync = broadcast/mpsc/oneshot/watch,
# rt = a task per module call, time = timeouts. Already in the Tauri tree; declared explicitly.
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
# Module manager (issue #9): CancellationToken and TaskTracker (feature `rt`). Already in the lock file.
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
# Unit tests run futures on a current-thread runtime; test-util = paused time for timeout tests.
# No `macros`: no new crate (decision 27 in #13).
tokio = { version = "1.54.1", features = ["rt", "time", "test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panic = "abort" from the template is intentionally removed:
# a panic in an optional module task must not terminate the whole app (see CLAUDE.md).
